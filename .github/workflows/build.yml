name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --stacktrace --info > build_log.txt 2>&1

      - name: Commit log if build failed
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add build_log.txt
          git commit -m "ci: build log (failure)" || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TikTokTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK into repo via API
        if: steps.build.outcome == 'success'
        run: |
          APK_PATH=app/build/outputs/apk/debug/app-debug.apk
          base64 -w0 "$APK_PATH" > /tmp/content_b64.txt
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/contents/TikTokTV-debug.apk" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha','')) if isinstance(d, dict) else print('')" > /tmp/sha.txt || echo "" > /tmp/sha.txt
          python3 -c "import json; c=open('/tmp/content_b64.txt').read().strip(); s=open('/tmp/sha.txt').read().strip(); p={'message':'ci: apk compilado','content':c}; p.update({'sha':s} if s else {}); open('/tmp/payload.json','w').write(json.dumps(p))"
          curl -s -X PUT -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/contents/TikTokTV-debug.apk" -d @/tmp/payload.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
