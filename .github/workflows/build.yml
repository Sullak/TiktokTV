name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --stacktrace --info > build_log.txt 2>&1

      - name: Commit log if build failed
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add build_log.txt
          git commit -m "ci: build log (failure)" || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TikTokTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK into repo
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          cp app/build/outputs/apk/debug/app-debug.apk ./TikTokTV-debug.apk
          git add TikTokTV-debug.apk
          git commit -m "ci: apk compilado" || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
